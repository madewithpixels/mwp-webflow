<!-- Shared core (window.MWP, docs/shared-core.md): one scroll dispatcher, one debounced resize, frame loops that sleep off screen, ready signals and helpers. Page scripts register here instead of adding their own listeners and polls. -->
<script>
  (function () {
    var scrollFns = [], resizeFns = [], lastY = null, queued = false, rt;
    function call(list) {
      for (var i = 0; i < list.length; i++) {
        try {
          list[i]();
        } catch (e) {
          console.error(e);
        }
      }
    }
    // at most once per scroll position; inside Lenis's own callback while it scrolls (no frame of lag)
    function dispatch(force) {
      var y = window.scrollY;
      if (!force && y === lastY) return;
      lastY = y;
      call(scrollFns);
    }
    addEventListener('scroll', function () {
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () {
        queued = false;
        dispatch();
      });
    }, { passive: true });
    addEventListener('resize', function () {
      dispatch(true);
      clearTimeout(rt);
      rt = setTimeout(function () {
        call(resizeFns);
      }, 150);
    }, { passive: true });
    // fn(value) once test() returns something (checked every 100ms for up to 10s)
    function when(test, fn) {
      var n = 0;
      (function check() {
        var v = test();
        if (v) fn(v);
        else if (++n < 100) setTimeout(check, 100);
      })();
    }
    var M = (window.MWP = {
      desktop: matchMedia('(min-width: 992px)'),
      reduce: matchMedia('(prefers-reduced-motion: reduce)'),
      onScroll: function (fn) {
        scrollFns.push(fn);
      },
      onResize: function (fn) {
        resizeFns.push(fn);
      },
      lenis: function (fn) {
        when(function () {
          return window.lenis && window.lenis.on ? window.lenis : null;
        }, fn);
      },
      scrollTrigger: function (fn) {
        when(function () {
          return window.ScrollTrigger && window.ScrollTrigger.getAll ? window.ScrollTrigger : null;
        }, fn);
      },
      // fn(now) every frame, only while el (or one of several) is within a screen of the viewport
      loop: function (el, fn) {
        var els = !el ? [] : el.nodeType ? [el] : Array.prototype.slice.call(el), near = new Set();
        var on = !els.length || !('IntersectionObserver' in window), running = false;
        function tick(now) {
          if (!on) return (running = false);
          fn(now);
          requestAnimationFrame(tick);
        }
        function start() {
          if (on && !running) {
            running = true;
            requestAnimationFrame(tick);
          }
        }
        if (on) start();
        else {
          var io = new IntersectionObserver(function (list) {
            list.forEach(function (e) {
              if (e.isIntersecting) near.add(e.target);
              else near.delete(e.target);
            });
            on = near.size > 0;
            start();
          }, { rootMargin: '100% 0px' });

      },
      lerp: function (a, b, t) {
        return a + (b - a) * t;
      },
      ease: function (x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      },
    });
    M.lenis(function (l) {
      l.on('scroll', function () {
        dispatch();
      });
    });
  })();
</script>

<!-- Scrollbar width for the menu rule above (not measured while Lenis has the page locked) -->
<script>
  (function () {
    var root = document.documentElement;
    function measure() {
      if (root.classList.contains('lenis-stopped')) return;
      var w = window.innerWidth - root.clientWidth;
      if (w >= 3) {
        root.style.setProperty('--mwp-sbw', w + 'px');
        root.classList.add('mwp-sbw');
      } else {
        root.style.removeProperty('--mwp-sbw');
        root.classList.remove('mwp-sbw');
      }
    }
    document.addEventListener('DOMContentLoaded', measure);
    window.addEventListener('load', measure);
    window.addEventListener('resize', measure);
    window.addEventListener('pageshow', measure);
  })();
</script>

<script>
  (function () {
    'use strict';
    if (!('onpageswap' in window)) return; // no cross-document view transitions: these routes just navigate normally

    const FROM_KEY = 'mwp-vt-from';
    const clean = (p) => p.replace(/\/+$/, '') || '/';
    const pathOf = (url) => clean(new URL(url, location.href).pathname);
    const here = () => clean(location.pathname);
    const isHome = (p) => p === '/';
    const isFolio = (p) => p.startsWith('/portfolio/');
    const morphRoute = (a, b) => (isHome(a) && isFolio(b)) || (isFolio(a) && isHome(b));
    window.MWPViewTransition = { morphRoute: (a, b) => morphRoute(clean(a), clean(b)) };

    const named = [];
    const name = (el, n) => {
      if (!el) return;
      el.style.viewTransitionName = n;
      named.push(el);
    };
    const clearNames = () => named.splice(0).forEach((el) => (el.style.viewTransitionName = ''));

    // Leaving a page: only home <-> project morphs; everything else navigates normally
    window.addEventListener('pageswap', (e) => {
      if (!e.viewTransition) return;
      const to = e.activation && e.activation.entry && e.activation.entry.url;
      if (!to || !morphRoute(here(), pathOf(to))) {
        e.viewTransition.skipTransition();
        return;
      }
      try {
        sessionStorage.setItem(FROM_KEY, here());
      } catch (err) {}
      if (isHome(here())) {
        const preview = Array.from(document.body.children).find((el) => el.style.zIndex === '9998' && el.style.opacity === '1');
        name(preview, 'folio-image');
      }
    });

    // Arriving on a page
    window.addEventListener('pagereveal', (e) => {
      if (!e.viewTransition) return;
      let from = null;
      let restoring = false;
      try {
        from = sessionStorage.getItem(FROM_KEY);
        sessionStorage.removeItem(FROM_KEY);
        restoring = !!sessionStorage.getItem('mwp-home-restore');
      } catch (err) {}
      if (isHome(here())) clearNames(); // leftovers from a back/forward-cache return
      if (!from || restoring || !morphRoute(from, here())) {
        e.viewTransition.skipTransition();
        return;
      }
      if (isHome(here())) e.viewTransition.finished.finally(clearNames);
    });
  })();
</script>
