<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css" />
<script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js" defer></script>
<script>
  // Portfolio + estimate pages fade the terminal in; elsewhere wait up to 5s for the Hero interaction's does-ripple before the fallback fade
  window.FaultyTerminalConfig = Object.assign({ warmStart: false }, location.pathname.startsWith('/portfolio/') || /^\/estimate\/?$/.test(location.pathname) ? { reveal: 'fade' } : { revealFallback: 5000 });

  // Faulty terminal size on small screens: a LOWER scale gives BIGGER characters. Tweak these numbers.
  (function () {
    const MOBILE_MAX_WIDTH = 767; // px — at or below this width the mobile scale is used
    const MOBILE_SCALE = MWP.tune('terminal-character-scale-phone', 1); // phones
    const DESKTOP_SCALE = MWP.tune('terminal-character-scale-desktop', 2); // everything wider (library default)
    const mq = window.matchMedia('(max-width: ' + MOBILE_MAX_WIDTH + 'px)');
    const pick = () => (mq.matches ? MOBILE_SCALE : DESKTOP_SCALE);
    window.FaultyTerminalConfig.scale = pick();
    // Crossing the breakpoint (rotate / resize) updates the running terminal(s) live
    mq.addEventListener('change', () => {
      const ft = window.FaultyTerminal;
      ((ft && ft.instances) || []).forEach((t) => t.setParam && t.setParam('scale', pick()));
    });
  })();
</script>

<script defer src="https://cdn.jsdelivr.net/gh/madewithpixels/faulty-terminal@v1.13.4/dist/faulty-terminal.min.js" integrity="sha384-RgchJgl30RLJAo1BFB7YzDpXuXc3S2I84f3+nDqy2DHaAxfoJ/3CmsLql7UKwXi4" crossorigin="anonymous" data-faulty-terminal-version="1.13.4" onerror="window.dispatchEvent(new CustomEvent('faulty-terminal:cdn-error',{detail:{version:'1.13.4'}}))"></script>
<script>
  // Lenis smooth scroll (lenis.min.js is deferred, so start it once deferred scripts have run)
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof Lenis === 'undefined') return;
    window.lenis = new Lenis({
      autoRaf: true,
      autoToggle: true,
      anchors: true,
      allowNestedScroll: true,
      naiveDimensions: true,
      stopInertiaOnNavigate: true,
    });
  });

  // Folio list hover preview (fine pointers only). The row under the pointer is worked out on every pointer move and scroll
  // frame (trackpad scrolling never moves the pointer, so the browser's own :hover lags). The .is-hovered CSS below copies
  // the Designer's Folio List Link hover state: KEEP IT IN STEP if you restyle that hover.
  (function () {
    'use strict';

    // Only enable on devices with a hover-capable pointer
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      return;
    }

    // ─── SETTINGS ──────────────────────────────────────────────────────────────
    const PREVIEW_W = MWP.tune('folio-preview-width-px', 400);
    const PREVIEW_GAP = MWP.tune('folio-preview-pointer-gap-px', 16);
    const FADE_MS = MWP.tune('folio-preview-fade-ms', 150); // box fade in/out
    const SWAP_MS = MWP.tune('folio-preview-image-swap-ms', 120); // image cross-fade when moving between items
    const SCALE_FROM = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : MWP.tune('folio-preview-start-scale', 0.97);

    // ─── FOLIO LIST ────────────────────────────────────────────────────────────
    const folioItems = document.querySelectorAll('.folio-list-link');
    if (!folioItems.length) return;

    // Row highlight driven by the script (mirrors the Designer's Folio List Link hover state)
    const css = document.createElement('style');
    css.textContent = ['html.mwp-folio-js .folio-list-link:hover:not(.is-hovered){padding-left:0;background-color:transparent;font-style:normal}', '@media (min-width:1920px){html.mwp-folio-js .folio-list-link:hover:not(.is-hovered){padding-left:2rem}}', 'html.mwp-folio-js .folio-list-link.is-hovered{padding-left:2.25vw;background-color:var(--raspberry);font-style:italic}'].join('\n');
    document.head.appendChild(css);
    document.documentElement.classList.add('mwp-folio-js');

    const preview = document.createElement('div');
    preview.style.cssText = ['position:fixed', 'left:0', 'top:0', 'pointer-events:none', 'z-index:9998', `width:${PREVIEW_W}px`, 'box-shadow:0 8px 32px rgba(0,0,0,0.3)', 'overflow:hidden', 'opacity:0', 'visibility:hidden', `transform:scale(${SCALE_FROM})`, 'will-change:opacity,transform'].join(';');

    const previewImg = document.createElement('img');
    previewImg.alt = '';
    previewImg.style.cssText = `width:100%;height:auto;display:block;transition:opacity ${SWAP_MS}ms ease-out;`;
    preview.appendChild(previewImg);
    document.body.appendChild(preview);

    let mouseX = 0;
    let mouseY = 0;
    let known = false; // has the pointer position been seen yet?
    let current = null; // src of the item currently hovered
    let active = null; // the .folio-list-link under the pointer
    let isShown = false;

    function positionPreview() {
      const flipX = mouseX + PREVIEW_GAP + PREVIEW_W > window.innerWidth;
      const x = flipX ? mouseX - PREVIEW_GAP - PREVIEW_W : mouseX + PREVIEW_GAP;

      const previewH = preview.offsetHeight || 200;
      const flipY = mouseY + previewH / 2 > window.innerHeight;
      const y = flipY ? mouseY - previewH : mouseY - previewH / 2;

      preview.style.left = `${x}px`;
      preview.style.top = `${Math.max(0, y)}px`;
    }

    function show() {
      isShown = true;
      preview.style.transition = `opacity ${FADE_MS}ms ease-out, transform ${FADE_MS}ms ease-out, visibility 0s linear 0s`;
      preview.style.visibility = 'visible';
      preview.style.opacity = '1';
      preview.style.transform = 'scale(1)';
    }

    function hide() {
      isShown = false;
      preview.style.transition = `opacity ${FADE_MS}ms ease-in, transform ${FADE_MS}ms ease-in, visibility 0s linear ${FADE_MS}ms`;
      preview.style.opacity = '0';
      preview.style.transform = `scale(${SCALE_FROM})`;
      preview.style.visibility = 'hidden';
    }

    // Resolve once the image is decoded, so it never appears half-loaded
    // (decode() can stall in some browsers, so once the file has loaded it waits at most 150ms for it)
    const loaded = {};
    function load(src) {
      if (!loaded[src]) {
        loaded[src] = new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            (img.decode ? img.decode() : Promise.resolve()).catch(() => {}).then(resolve);
            setTimeout(resolve, 150);
          };
          img.onerror = resolve;
          img.src = src;
        });
      }
      return loaded[src];
    }

    // Warm the cache when the list comes near the viewport
    const list = folioItems[0].closest('.folio-list-container') || folioItems[0];
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(
        (entries) => {
          if (!entries.some((e) => e.isIntersecting)) return;
          io.disconnect();
          folioItems.forEach((item) => {
            const src = item.closest('li')?.dataset.preview;
            if (src) load(src);
          });
        },
        { rootMargin: '600px 0px' },
      );
      io.observe(list);
    }

    function enter(src) {
      current = src;

      // Same image as last time: just bring the box back
      if (previewImg.getAttribute('src') === src) {
        previewImg.style.opacity = '1';
        positionPreview();
        show();
        return;
      }

      // Moving between items: dip the old image out while the new one decodes
      if (isShown) previewImg.style.opacity = '0';

      load(src).then(() => {
        if (current !== src) return; // pointer has already moved on
        previewImg.src = src;
        previewImg.style.opacity = '1';
        positionPreview();
        show();
      });
    }

    function leave() {
      current = null;
      hide();
    }

    function setActive(link) {
      if (link === active) return;
      if (active) active.classList.remove('is-hovered');
      active = link;
      if (!link) return leave();
      link.classList.add('is-hovered');
      const src = link.closest('li')?.dataset.preview;
      src ? enter(src) : leave();
    }

    // What's under the pointer right now (the preview itself ignores the pointer)
    function hitTest() {
      if (!known) return;
      const el = document.elementFromPoint(mouseX, mouseY);
      setActive((el && el.closest('.folio-list-link')) || null);
      if (isShown) positionPreview();
    }
    let queued = false;
    function queue() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        hitTest();
      });
    }
    function track(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      known = true;
      queue();
    }

    document.addEventListener('mousemove', track, { passive: true });
    window.addEventListener('wheel', track, { passive: true }); // trackpad scrolls don't move the pointer, but say where it is
    MWP.onScroll(queue);
    // Pointer left the window
    document.addEventListener('mouseout', (e) => {
      if (e.relatedTarget) return;
      known = false;
      setActive(null);
    });
  })();

  // Project page transition: the arrows slide the title, copy and screenshots off towards the arrow pressed, then the next
  // project slides in from the other side (the site head hides it until then). The arrows stay put.
  (function () {
    'use strict';

    // ─── SETTINGS ──────────────────────────────────────────────────────────────
    const DURATION = MWP.tune('project-slide-duration-ms', 420); // ms each element takes to slide
    const STAGGER = MWP.tune('project-slide-stagger-ms', 70); // ms between one element starting and the next
    const EASE = 'cubic-bezier(0.4, 0, 0.2, 1)';
    const GAP = MWP.tune('project-slide-edge-margin-px', 8); // px past the edge of the box an element is clipped by
    const IMAGE_WAIT_MS = MWP.tune('project-slide-image-wait-ms', 1200); // longest the entrance waits for the first screenshots to decode
    const TARGETS = '.project-title-wrapper, .folio-rte-wrapper, .project-page-image';
    const KEY = 'mwp-pt'; // direction of the last arrow press (-1 left, 1 right), read by the next page
    const HOME_Y = 'mwp-home-y'; // last scroll position on the home page
    const HOME_RESTORE = 'mwp-home-restore'; // set by the project back button

    const root = document.documentElement;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isHome = location.pathname === '/';
    const isFolio = (path) => path.startsWith('/portfolio/');
    let busy = false;
    let running = [];

    // While the slide plays (and while the next page waits to slide in) the copy and screenshot columns' own scrollbars would stay
    // fixed in place: make them invisible. Their 8px width is kept, so nothing shifts. (Scrollbar look: site head, "R-081" block.)
    const hideBars = document.createElement('style');
    hideBars.textContent = ['html.mwp-pt-run', 'html.mwp-pt-enter'].map((h) => ['.project-image-wrapper', '.folio-rte-wrapper'].map((c) => `${h} ${c}::-webkit-scrollbar-track,${h} ${c}::-webkit-scrollbar-thumb`).join(',')).join(',') + '{background:transparent !important;border-color:transparent !important}';
    document.head.appendChild(hideBars);

    const nextPaint = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

    // Elements moving sideways are clipped by their scrolling box (the screenshot column), else by the window

        if (/(auto|scroll|hidden|clip)/.test(getComputedStyle(p).overflowX)) return p.getBoundingClientRect();

    // The elements on screen now, with how far each must move to be fully out of sight towards `side` (1 right, -1 left)
    function targets() {

      return Array.from(document.querySelectorAll(TARGETS))
        .map((el) => ({ el, r: el.getBoundingClientRect(), box: clipBox(el) }))
        .filter((t) => t.r.width > 0 && t.r.height > 0 && t.r.bottom > 0 && t.r.top < vh)
        .map((t) => ({
          el: t.el,
          key: t.r.left * 10000 + t.r.top,
          away: (side) => (side > 0 ? t.box.right - t.r.left + GAP : -(t.r.right - t.box.left + GAP)),
        }));
    }

    // Leaving: slide off towards `dir`, the elements nearest that edge first
    function exit(dir) {
      const list = targets().sort((a, b) => (dir > 0 ? b.key - a.key : a.key - b.key));
      root.classList.add('mwp-pt-run');
      running = list.map((t, i) =>
        t.el.animate([{ transform: 'translateX(0)', opacity: 1 }, { transform: `translateX(${t.away(dir)}px)`, opacity: 0 }], { duration: DURATION, delay: i * STAGGER, easing: EASE, fill: 'forwards' }),
      );
      return Promise.all(running.map((a) => a.finished)).catch(() => {});

    // Arriving: slide in from the side opposite to `dir`, the elements nearest that edge first
    function enter(dir) {
      const list = targets().sort((a, b) => (dir > 0 ? a.key - b.key : b.key - a.key));
      const images = Array.from(document.querySelectorAll('.project-page-image'))
        .filter((img) => img.complete === false || !img.naturalWidth)
        .slice(0, 2)
        .map((img) => new Promise((resolve) => (img.addEventListener('load', resolve, { once: true }), img.addEventListener('error', resolve, { once: true }))));
      return Promise.race([Promise.all(images), new Promise((r) => setTimeout(r, IMAGE_WAIT_MS))]).then(() => {
        root.classList.add('mwp-pt-run');
        const anims = list.map((t, i) =>
          t.el.animate([{ transform: `translateX(${t.away(-dir)}px)`, opacity: 0 }, { opacity: 1, offset: 0.3 }, { transform: 'translateX(0)', opacity: 1 }], { duration: DURATION, delay: i * STAGGER, easing: EASE, fill: 'both' }),
        );

        return Promise.all(anims.map((a) => a.finished)).then(() => {
          anims.forEach((a) => a.cancel());
          root.classList.remove('mwp-pt-run');
        });
      });
    }

    // Left arrow = the one further left (the first in the page if they are stacked)
    function directionOf(link) {
      const arrows = Array.from(document.querySelectorAll('.project-nav_arrow'));
      if (arrows.length < 2) return 1;
      const a = arrows[0].getBoundingClientRect().left;
      const b = arrows[1].getBoundingClientRect().left;
      const i = arrows.indexOf(link);
      if (Math.abs(a - b) < 4) return i === 0 ? -1 : 1;
      return (a < b ? i === 0 : i === 1) ? -1 : 1;
    }

    // Home page: remember where the visitor was when they leave
    if (isHome) {
      window.addEventListener('pagehide', () => {
        try {
          sessionStorage.setItem(HOME_Y, String(Math.round(window.scrollY)));
        } catch (e) {}
      });
    }

    // Home page reached via the project back button: jump to the remembered spot (hidden by the head rule) once the layout has settled
    function restoreHome() {
      let y = null;
      try {
        if (sessionStorage.getItem(HOME_RESTORE)) {
          sessionStorage.removeItem(HOME_RESTORE);
          y = sessionStorage.getItem(HOME_Y);
        }
      } catch (e) {}
      if (!isHome || y === null) return Promise.resolve();
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      const target = parseFloat(y) || 0;
      return new Promise((resolve) => {
        const jump = () => {
          if (window.lenis) window.lenis.scrollTo(target, { immediate: true, force: true });
          else window.scrollTo(0, target);
          if ('scrollRestoration' in history) history.scrollRestoration = 'auto'; // browser back/forward restores normally again

        setTimeout(resolve, 2500);
      });
    }

    // The project arrows (project to project only)
    document.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest('a.project-nav_arrow[href]');
      if (!a || a.hasAttribute('download') || (a.target && a.target !== '_self')) return;
      const url = new URL(a.href, location.href);
      if (url.origin !== location.origin || url.pathname === location.pathname) return;
      if (!isFolio(url.pathname) || !isFolio(location.pathname) || reduceMotion || busy) return;
      e.preventDefault();
      busy = true;
      const dir = parseInt(a.getAttribute('data-mwp-swipe'), 10) || directionOf(a); // a swipe (MWPSwipeNav) names its own direction: the content follows the finger (R-135)
      try {
        sessionStorage.setItem(KEY, String(dir));
      } catch (err) {}
      exit(dir).then(() => {
        location.href = url.href;
      });
      // Safety net: if navigation never happens, put everything back
      setTimeout(() => {
        if (busy && document.visibilityState === 'visible') settle();
      }, 4000);
    });

    function settle() {
      busy = false;
      running.forEach((a) => a.cancel());
      running = [];
      root.classList.remove('mwp-pt-run');
      try {
        sessionStorage.removeItem(KEY);
      } catch (e) {}
    }

    // Arriving: read (and clear) the direction, then slide in, or just show the page
    let dir = 0;
    try {
      dir = parseInt(sessionStorage.getItem(KEY), 10) || 0;
      sessionStorage.removeItem(KEY);
    } catch (e) {}
    const reveal = () => {
      if (root.classList.contains('mwp-pt-restore')) {
        root.classList.remove('mwp-pt-restore');
        if (!reduceMotion) document.body.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
      }
      if (root.classList.contains('mwp-pt-enter')) {
        if (dir && !reduceMotion && isFolio(location.pathname)) enter(dir);
        else root.classList.remove('mwp-pt-enter');
      }
    };
    if (root.classList.contains('mwp-pt-enter') || root.classList.contains('mwp-pt-restore')) {
      restoreHome().then(() => requestAnimationFrame(reveal));
    } else {
      restoreHome();
    }

    // Returning via browser back/forward from the bfcache with the content slid away
    window.addEventListener('pageshow', (e) => {
      if (e.persisted && busy) settle();
    });
  })();

  // Back button: returns to the home page at the last scroll position (portfolio section if there isn't one)
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[data-back]').forEach((link) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();

        // Came straight from the home page: step back in history so the browser restores the scroll and the title morphs back
        const vt = window.MWPViewTransition;
        const nav = window.navigation;
        const prev = nav && nav.currentEntry && nav.entries()[nav.currentEntry.index - 1];
        if (vt && prev && new URL(prev.url).pathname === '/') {
          history.back();
          return;
        }

        // Otherwise (e.g. after browsing several projects): fresh load of the home page, restored at the saved spot
        let saved = false;
        try {
          saved = sessionStorage.getItem('mwp-home-y') !== null;
          sessionStorage.setItem('mwp-home-restore', '1');
        } catch (err) {}
        location.href = saved ? '/' : '/#portfolio';
      });
    });
  });

  // Scroll magnet (desktop): sections with the attribute data-snap catch a downward scroll at their start, keeping its speed
  // and absorbing the trackpad's leftover coasting; a slow scroll that stops just short of (or just past) a start glides the
  // last bit. data-snap="" catches at the top; a number lands that many screen heights in (data-snap="1").
  // Off for reduced motion and while the menu is open; menu jumps are never caught.
  (function () {
    'use strict';
    // --- SETTINGS ---
    var CATCH = MWP.tune('magnet-catch-on-1-or-0', 1) !== 0; // false = settle only (v1 behaviour)

    // or until a NEW scroll starts (the wheel speeds up again) - then scrolling is free again
    var ABSORB_MAX = MWP.tune('magnet-absorb-limit-ms', 2500); // safety: never hold for longer than this (ms)
    var MIN_GLIDE = MWP.tune('magnet-glide-shortest-s', 0.35); // catch deceleration time limits (s) - the actual time matches the incoming speed
    var MAX_GLIDE = MWP.tune('magnet-glide-longest-s', 1.1);
    var AHEAD = MWP.tune('magnet-settle-zone-before-screens', 0.35); // settle zone before a section (screen heights)
    var PAST = MWP.tune('magnet-settle-zone-after-screens', 0.2); // settle zone after a section start (screen heights)
    var REST_MS = MWP.tune('magnet-settle-wait-ms', 140); // settle: how long the scroll must be still first
    var MIN_WIDTH = 992; // only at this width and up
    // ---
    var desktop = window.matchMedia('(min-width: ' + MIN_WIDTH + 'px)');
    var reduce = MWP.reduce;
    var armed = false,
      down = false,
      lastY = window.scrollY,
      timer = 0,
      gliding = false;
    var moving = false,
      startY = 0;
    var absorbing = false,
      absorbStart = 0,
      lastWheel = 0,
      lastDelta = 0,
      glideDone = true;

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    function active() {
      var l = window.lenis;
      return desktop.matches && !reduce.matches && !(l && l.isStopped);
    }
    function starts() {
      // absolute scroll position of each data-snap section's start (a GSAP pin's .pin-spacer if it has one)
      var out = [];
      document.querySelectorAll('[data-snap]').forEach(function (el) {
        if (!el.offsetHeight) return; // hidden at this breakpoint
        var p = el.parentElement,
          h = p && p.classList.contains('pin-spacer') ? p : el;
        var at = parseFloat(el.getAttribute('data-snap')) || 0; // optional: land this many screen heights INTO the section
        out.push(window.scrollY + h.getBoundingClientRect().top + at * window.innerHeight);

    }

    // ---- 1. CATCH ----

        target = l.targetScroll;

      });

      var dist = hit - x,

      absorbing = true;
      glideDone = false;

        easing: easeOut,
        force: true,
        onComplete: function () {
          glideDone = true;
        },

        function () {
          glideDone = true;
        },
        dur * 1000 + 150,

    window.addEventListener(
      'wheel',
      function (e) {

          var d = Math.abs(e.deltaY);
          // coasting only ever slows down; a wheel that speeds up again (once the catch has finished) is a new scroll
          if (glideDone && d > lastDelta * 1.5 + 4) {
            absorbing = false;
          } else {
            lastDelta = Math.min(lastDelta, d); // the slowest coasting seen - a new flick stands out against it
            lastWheel = performance.now();
            e.preventDefault();
            e.stopImmediatePropagation();
            return;
          }
        }
        armed = true;
        gliding = false;
      },
      { passive: false, capture: true },
    );

    // ---- 2. SETTLE ----
    function check() {
      moving = false;
      if (!armed || !down || gliding || absorbing || !active()) return;
      var vh = window.innerHeight,
        y = window.scrollY,
        best = null;
      starts().forEach(function (s) {
        var top = s - y; // the section start, measured from the screen top
        var startedAbove = startY < s - 2; // never pull someone back who was already inside the section
        if (startedAbove && top <= AHEAD * vh && top >= -PAST * vh && Math.abs(top) > 2) {
          if (best === null || Math.abs(top) < Math.abs(best)) best = top;
        }
      });
      if (best === null) return;
      armed = false;
      var dur = 0.45 + Math.min(1, Math.abs(best) / (Math.max(AHEAD, PAST) * vh)) * 0.45;
      var l = window.lenis;
      if (l && l.scrollTo) {
        gliding = true;
        l.scrollTo(y + best, {
          duration: dur,
          easing: MWP.ease,
          onComplete: function () {
            gliding = false;
          },
        });
        setTimeout(
          function () {
            gliding = false;
          },
          dur * 1000 + 200,
        );
      } else {
        window.scrollTo({ top: y + best, behavior: 'smooth' });
      }
    }
    window.addEventListener(
      'scroll',
      function () {
        var y = window.scrollY;
        if (!moving) {
          moving = true;
          startY = lastY;
        }
        if (y !== lastY) down = y > lastY;
        lastY = y;
        clearTimeout(timer);
        timer = setTimeout(check, REST_MS);
      },
      { passive: true },
    );
    window.addEventListener(
      'touchmove',
      function () {
        armed = true;
      },
      { passive: true },
    );
    window.addEventListener('keydown', function (e) {
      if (['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', ' ', 'Spacebar', 'End', 'Home'].indexOf(e.key) > -1) armed = true;
    });

    MWP.lenis(function (l) {
      l.on('scroll', onLenisScroll);
    });
  })();
</script>
<script>
  // Menu closed when the page is left, and again on a back/forward-cache return (Back must not restore an open menu)
  (function () {
    function closeMenu() {
      var m = document.querySelector('[data-mwp-menu]');
      if (m && m.open) m.open = false;
    }
    window.addEventListener('pagehide', closeMenu);
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) closeMenu();
    });
  })();

  // Project pages: the menu's "#" section links go to those sections on Home
  (function () {
    if (location.pathname.indexOf('/portfolio/') !== 0) return;
    var MAP = { About: '/#about', Pricing: '/#pricing', Work: '/#portfolio', Testimonials: '/#testimonials', Contact: '/#contact' };
    function fix() {
      var links = document.querySelectorAll('a[href="#"]');
      for (var i = 0; i < links.length; i++) {
        var to = MAP[(links[i].textContent || '').trim()];
        if (to) {
          links[i].setAttribute('href', to);
          links[i].setAttribute('data-r145', '');
        }
      }
    }
    fix();
    new MutationObserver(fix).observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener(
      'click',
      function (e) {
        var a = e.target.closest && e.target.closest('a[data-r145]');
        if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
        e.preventDefault();
        e.stopPropagation();
        window.location.href = a.getAttribute('href');
      },
      true,
    );
  })();

  // Project pages, touch: a quick sideways swipe taps the next / previous arrow (so it gets the slide), and the content follows
  // the finger. Ignores scrolls, pinches and swipes that start in a sideways-scrolling strip.
  (function () {
    if (location.pathname.indexOf('/portfolio/') !== 0) return;
    var MIN = MWP.tune('swipe-minimum-distance-px', 60), MAX_MS = MWP.tune('swipe-maximum-time-ms', 700), x0, y0, t0, ok = false;
    function scrollsSideways(el) {
      for (; el && el !== document.body; el = el.parentElement) {
        if (el.scrollWidth > el.clientWidth + 2 && /(auto|scroll)/.test(getComputedStyle(el).overflowX)) return true;
      }
      return false;
    }
    addEventListener(
      'touchstart',
      function (e) {
        var t = e.touches[0];
        ok = e.touches.length === 1 && !scrollsSideways(e.target);
        x0 = t.clientX;
        y0 = t.clientY;
        t0 = Date.now();
      },
      { passive: true },
    );
    addEventListener(
      'touchend',
      function (e) {
        if (!ok) return;
        ok = false;
        var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
        if (Date.now() - t0 > MAX_MS || Math.abs(dx) < MIN || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        var a = document.querySelector('a.project-nav_arrow[data-portfolio-nav="' + (dx < 0 ? 'next' : 'prev') + '"][href]');
        if (a) {
          a.setAttribute('data-mwp-swipe', dx < 0 ? '-1' : '1');
          a.click();
          a.removeAttribute('data-mwp-swipe');
        }
      },
      { passive: true },
    );
  })();
</script>
<script>
  /* Skip link (the link is in the Skip Link component; CSS in the Site head).
     Target: [data-skip-target], else <main>; on a blank page the link removes itself.
     The click is stopped here (preventDefault and stopPropagation) so Webflow's anchor smooth-scroll can't drag the page afterwards.
     Where the menu has a link to the same target, that link is clicked so the nav jump lands it (pin-spacers, data-nav-offset);
     otherwise Lenis, otherwise a plain jump. Focus moves to the target (tabindex -1, preventScroll) for screen readers. */
  (function () {
    function init() {
      var link = document.querySelector('.mwp-skip-link');
      if (!link || link.dataset.mwpSkip) return;
      if (document.querySelector('.skip-embed script')) return; // the embed still carries its own copy
      link.dataset.mwpSkip = '1';
      var target = document.querySelector('[data-skip-target]') || document.querySelector('main');
      if (!target) {
        link.remove();
        return;
      }
      if (!target.id) target.id = 'main-content';
      link.setAttribute('href', '#' + target.id);
      function land() {
        if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
        target.focus({ preventScroll: true });
      }
      link.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var viaNav = document.querySelector('.mwp-css-nav_link[href="#' + target.id + '"]');
        if (viaNav) {
          viaNav.click();
          setTimeout(land, 0);
          return;
        }
        var base = target.closest('.pin-spacer') || target;
        var y = base.getBoundingClientRect().top + window.scrollY;
        if (window.lenis && window.lenis.scrollTo) window.lenis.scrollTo(y, { immediate: true, force: true });
        else window.scrollTo(0, y);
        land();
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
</script>
